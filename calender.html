<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tab title -->
    <title>UniGuide - Calendar</title>

   <!-- linked style sheet -->
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-background">
    <!-- Note -->
  <div class="note-popup">
    <p>!This page is a representation only!</p>
  </div>

  <!-- Fixed Header -->
<header class="top_header">
    <h1 class="logo">UG</h1> <!-- Main logo for UniGuide-->
        <!-- Main segment for header to display user profile and map -->
        <div class="header_content">

            <!-- sub section of header to display user profile and course-->
            <div class="user_card"> 
                <img src="assets/profile_picture.jpg" alt="profile picture">

                <!-- Containers for text, easier for css to customise-->
                <div class="user_text">
                    <p class="user_name">Alysa Chopra</p>
                    <p class="user_sub">FT BSC COMPUTER SCIENCE (SOFTWARE ENGINEERING)</p>
                </div>
            </div>

            <!-- Other sub section to display the map icon, an a tag instead for it to open the campus map-->
            <a href="#campus-map-global" class="campus_map" class="bottom-page">
                <img src="assets/campus_map_icon.png" alt="map icon">
            </a>
        </div>
    </header>



    <!-- Main Content Area -->


    <!-- 2. Yellow Title Card -->
    <div class="title-card">
      <h1>Calendar</h1>
      <div class="content-card">
        <img id="calendar-img" src="assets/My Schedule.png" alt="map icon">
        <img id="calendar-img" src="assets/Group 30 - bottom.png" alt="map icon">
      </div>
    </div>

<!-- BOTTOM PAGE - MAP -->
        <div class="page-overlay"></div>
        <div id="campus-map-global" class="bottom-page">
            <div class="drag-handle"></div>
            <a href="#profile">Close</a>
            <h2>Interactive Campus Map</h2>

            <!-- Map Image -->
            <img id="app-map"
                src="./assets/interactive-campus-map.png"
                alt="Students coding around a table">
        </div>

<!-- BOTTOM NAVIGATION (Shahid)-->
<footer class="bottom_nav">
    <nav class="nav_buttons">
        <a href="index.html" class="nav_item"> 
            <img src="assets/home_icon.png" alt="Home icon">
            <span>Home</span>
        </a>
        <a href="calendar.html" class="nav_item active"> <!-- Active added to be highlighted, easier for user's to understand what page they are in -->
            <img src="assets/calender_icon.png" alt="Calendar icon">
            <span>Calendar</span>
        </a>
        <a href="settings.html" class="nav_item">
            <img src="assets/settings_icon.png" alt="Settings icon">
            <span>Settings</span>
        </a>
    </nav>
</footer>

</body>
</html>
