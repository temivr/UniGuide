<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings | UniGuide</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!--PROFILE -->
    <header class="top_header" id="profile">
        <h1 class="logo">UG</h1> <!-- Main logo for UniGuide-->

        <!-- Main segment for header to display user profile and map -->
        <div class="header_content">

            <!-- sub section of header to display user profile and course-->
            <div class="user_card"> 
                <img src="assets/profile_picture.jpg" alt="profile picture">

                <!-- Containers for text, easier for css to customise-->
                <div class="user_text">
                    <p class="user_name">Alysa Chopra</p>
                    <p class="user_sub">FT BSC COMPUTER SCIENCE (SOFTWARE ENGINEERING)</p>
                </div>
            </div>

            <!-- Other sub section to display the map icon, an a tag instead for it to open the campus map-->
            <a href="#" class="campus_map">
                <img src="assets/campus_map_icon.png" alt="map icon">
            </a>
        </div>
    </header>

<div class="title-card">
        <h2></h2>   
        <p>
        <main class="settings-page">
        <h1>Settings</h1>
        <details>
            <summary>
                <img src="	assets/settings - icons/accessibility.png"
                    alt=""
                    class="settings-icon"
                    width="24"
                    height="24">
                Accessibility
            </summary>
            <div class="settings-row">
                <label for="text-size">Text size</label>
                <input id="text-size" type="range">
            </div>
            <div class="settings-row">
                <label for="high-contrast">High contrast</label>
                <input id="high-contrast" type="checkbox">
            </div>
            <div class="settings-row">
                <label for="spoken-directions">Spoken directions</label>
                <input id="spoken-directions" type="checkbox">
            </div>
        </details>

        <details>
            <summary>
                <img class="settings-icon" src="assets/settings - icons/map-pin.png" 
                    alt="" width="24" height="24">
                Map Preferences
            </summary>
            <div class="settings-row">
            <label for="map-orientation">Map orientation</label>
            <select id="map-orientation">
                <option>North-up</option>
                <option>Direction of travel</option>
            </select>
            </div>
            <div class="settings-row">
                <label for="show-landmarks">Show landmarks</label>
                <input id="show-landmarks" type="checkbox">
            </div>            
        </details>

        <details>
            <summary>
                <img class="settings-icon" src="assets/settings - icons/bell.png" 
                    alt="" width="24" height="24">
                Notifications
            </summary>
            <div class="settings-row">
                <label for="enable-class-reminders">Enable class reminders</label>
                <input id="enable-class-reminders" type="checkbox">
            </div>
            <div id="reminder-timing" class="settings-row">
                <label for="reminder-time">Remind me before class</label>
                    <select id="reminder-time">
                        <option>5 minutes before</option>
                        <option>10 minutes before</option>
                        <option>15 minutes before</option>
                    </select>
            </div>   
        </details>

        <details>
            <summary>
                <img class="settings-icon" src="assets/settings - icons/person.png" 
                    alt="" width="24" height="24">
                Account &amp; Support
            </summary>
            <div class="settings-row">
                <a href="#profile">View profile</a>
            </div>
            <div class="settings-row">
                <a href="https://www.gold.ac.uk/students/student-hub/">Help & support</a>
            </div>
            <div class="settings-row">
                <button type="button">Log out</button>
            </div>
        </details>
    </main>
    </p>
</div>

    <!-- NAVIGATION-->
    <footer class="bottom_nav">

        <!-- Listed links for each icon-->
        <nav class="nav_buttons">
            <a href="/index.html" class="nav_item"> <!-- hashtag makes this section an entire link, no address has been added yet-->
                <img src="assets/home_icon.png" alt="Home icon">
                <span>Home</span>
            </a>
            <a href="/calender.html" class="nav_item active"> <!-- Active added to be highlighted, easier for user's to understand what page they are in -->
                <img src="assets/calender_icon.png" alt="Calendar icon">
                <span>Calendar</span>
            </a>
            <a href="/settings.html" class="nav_item">
                <img src="assets/settings_icon.png" alt="Settings icon">
                <span>Settings</span>
            </a>
        </nav>
    </footer>

    

</body>
</html>
