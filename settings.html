<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Changed from "Setting | UniGuide" to match other pages (Temi) -->
    <title>UniGuide - Settings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-background">

        <!-- PROFILE SECTION -->
        <header class="top_header" id="profile">

            <!-- Main logo for UniGuide -->
            <h1 class="logo">UG</h1>

            <!-- Main segment to display user profile and map -->
            <div class="header_content">

                <!-- Sub section to display user profile and course -->
                <div class="user_card">
                    <img
                        src="assets/profile_picture.jpg"
                        alt="Profile picture">

                    <!-- Container for text, easier for CSS to customise -->
                    <div class="user_text">
                        <p class="user_name">Alysa Chopra</p>
                        <p class="user_sub">
                            FT BSC COMPUTER SCIENCE (SOFTWARE ENGINEERING)
                        </p>
                    </div>
                </div>

                <!-- Opens the shared bottom page -->
                <a href="#campus-map-global" class="campus_map">
                    <img src="assets/campus_map_icon.png" alt="Campus map">
                </a>

            </div>
        </header>

        <!-- SETTINGS -->
        <main class="settings-page">

            <!-- Temi's yellow card behind the title and grey card -->
            <div class="title-card">
                <h1>Settings</h1>

                <!-- Grey card behind all four dropdowns -->
                <div class="content-card">

                    <!-- Accessibility dropdown, opens without JavaScript -->
                    <details>
                        <summary>
                            <!-- Empty alt as the heading explains the icon -->
                            <img
                                src="assets/settings%20-%20icons/accessibility.png"
                                alt=""
                                class="settings-icon"
                                width="24"
                                height="24">
                            Accessibility
                        </summary>

                        <!-- Each row groups the label with its input for CSS -->
                        <div class="settings-row">
                            <!-- The for matches the input id to connect them -->
                            <label for="text-size">Text size</label>
                            <input id="text-size" type="range">
                        </div>

                        <div class="settings-row">
                            <label for="high-contrast">High contrast</label>
                            <input id="high-contrast" type="checkbox">
                        </div>

                        <div class="settings-row">
                            <label for="spoken-directions">
                                Spoken directions
                            </label>
                            <input id="spoken-directions" type="checkbox">
                        </div>
                    </details>

                    <!-- Map preferences dropdown -->
                    <details>
                        <summary>
                            <img
                                src="assets/settings%20-%20icons/map-pin.png"
                                alt=""
                                class="settings-icon"
                                width="24"
                                height="24">
                            Map Preferences
                        </summary>

                        <div class="settings-row">
                            <label for="map-orientation">
                                Map orientation
                            </label>

                            <!-- Two options for the map orientation -->
                            <select id="map-orientation">
                                <option>North-up</option>
                                <option>Direction of travel</option>
                            </select>
                        </div>

                        <div class="settings-row">
                            <label for="show-landmarks">Show landmarks</label>
                            <input id="show-landmarks" type="checkbox">
                        </div>
                    </details>

                    <!-- Notifications dropdown -->
                    <details>
                        <summary>
                            <img
                                src="assets/settings%20-%20icons/bell.png"
                                alt=""
                                class="settings-icon"
                                width="24"
                                height="24">
                            Notifications
                        </summary>

                        <div class="settings-row">
                            <label for="enable-class-reminders">
                                Enable class reminders
                            </label>
                            <input
                                id="enable-class-reminders"
                                type="checkbox">
                        </div>

                        <div id="reminder-timing" class="settings-row">
                            <label for="reminder-time">
                                Remind me before class
                            </label>

                            <select id="reminder-time">
                                <option>5 minutes before</option>
                                <option>10 minutes before</option>
                                <option>15 minutes before</option>
                            </select>
                        </div>
                    </details>

                    <!-- Account and support dropdown -->
                    <details>
                        <summary>
                            <img
                                src="assets/settings%20-%20icons/person.png"
                                alt=""
                                class="settings-icon"
                                width="24"
                                height="24">
                            Account &amp; Support
                        </summary>

                        <div class="settings-row">
                            <!-- Jumps to the profile header -->
                            <a href="#profile">View profile</a>
                        </div>

                        <div class="settings-row">
                            <!-- Opens the Goldsmiths Student Hub -->
                            <a href="https://www.gold.ac.uk/students/student-hub/">
                                Help &amp; support
                            </a>
                        </div>

                        <div class="settings-row">
                            <!-- Prototype button, logout is not connected -->
                            <button type="button">Log out</button>
                        </div>
                    </details>

                </div>
            </div>
        </main>

        
        <!-- Shared Map bottom page -->
        <div class="page-overlay"></div>

        <div id="campus-map-global" class="bottom-page">

            <!-- Changes the target to close the bottom page -->
            <a href="#profile">Close</a>

            <div class="drag-handle"></div>
            <h2>Interactive Campus Map</h2>
            <br>
            <!-- Map Image -->
            <img id="app-map"
                src="./assets/interactive-campus-map.png"
                alt="Students coding around a table">
        </div>


        <!-- FIXED BOTTOM NAVIGATION -->
        <footer class="bottom_nav">

            <!-- Listed links for each page -->
            <nav class="nav_buttons" aria-label="Main navigation">
                <a href="index.html" class="nav_item">
                    <!-- Empty alt as the page name is below the icon -->
                    <img src="assets/home_icon.png" alt="">
                    <span>Home</span>
                </a>

                <a href="calendar.html" class="nav_item">
                    <img src="assets/calender_icon.png" alt="">
                    <span>Calendar</span>
                </a>

                <!-- Active highlights the page the user is on -->
                <a
                    href="settings.html"
                    class="nav_item active"
                    aria-current="page">
                    <img src="assets/settings_icon.png" alt="">
                    <span>Settings</span>
                </a>
            </nav>

        </footer>
    </div>
</body>
</html>
